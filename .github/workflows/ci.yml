name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Safety rules are in sync
        run: npm run safety:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
        env:
          CI: "1"
      - name: Tests
        run: npm test
